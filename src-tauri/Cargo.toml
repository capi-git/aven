[package]
name = "monocode"
version.workspace = true
edition.workspace = true
description = "Aven — one UI for every agent harness"
authors = ["Jack Hagan", "Nick"]
repository = "https://github.com/capi-git/aven"
homepage = "https://github.com/capi-git/aven"
license.workspace = true

[lib]
name = "monocode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["chromium"]
chromium = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
ureq = { version = "2.12.1", default-features = false, features = ["tls", "gzip"] }
tauri-plugin-process = "2"

[dev-dependencies]
minisign-verify = "0.2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
portable-pty = { version = "0.9", path = "../vendor/portable-pty" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSColor", "NSControl", "NSDockTile", "NSImage", "NSLayoutAnchor", "NSLayoutConstraint", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3.2", features = ["UNUserNotificationCenter", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "block2"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"
