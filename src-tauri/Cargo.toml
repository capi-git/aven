[package]
name = "aven"
version.workspace = true
edition.workspace = true
description = "Aven — one UI for every agent harness"
authors = ["Jack Hagan", "Nick"]
repository = "https://github.com/capi-git/aven"
homepage = "https://github.com/capi-git/aven"
license.workspace = true

[lib]
name = "aven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["chromium"]
chromium = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles the iPhone pane's Objective-C bridge (macos/ios_simulator.m).
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
ureq = { version = "2.12.1", default-features = false, features = ["tls", "gzip"] }
# Page screenshots are stored as JPEG; png is already in the dependency tree.
jpeg-encoder = "0.7.1"
png = "0.18.1"

[dev-dependencies]
jpeg-decoder = { version = "0.3.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "2.1"
portable-pty = { version = "0.9", path = "../vendor/portable-pty" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", features = ["block2"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSColor", "NSControl", "NSDockTile", "NSImage", "NSLayoutAnchor", "NSLayoutConstraint", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSError", "NSString"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAAnimation", "CABase", "CADisplayLink", "CALayer", "CAMediaTiming", "CAMediaTimingFunction", "CATextLayer", "CATransaction", "CATransform3D", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKPreferences", "WKWebViewConfiguration"] }
objc2-user-notifications = { version = "0.3.2", features = ["UNUserNotificationCenter", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "block2"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"
