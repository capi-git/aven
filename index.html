<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/aven.png" />
    <title>Aven</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var hue = localStorage.getItem("monocode.themeHue");
          var sat = localStorage.getItem("monocode.themeSaturation");
          var opacity = localStorage.getItem("monocode.sidebarOpacity");
          if (hue != null) {
            var h = Math.max(0, Math.min(360, Number(hue) || 0));
            root.style.setProperty("--theme-hue", String(h));
          }
          if (sat != null) {
            var s = Math.max(0, Math.min(100, Number(sat) || 0));
            root.style.setProperty("--theme-saturation", s + "%");
          }
          if (opacity != null) {
            var o = Math.max(0.05, Math.min(1, Number(opacity) || 1));
            root.style.setProperty("--sidebar-opacity", String(o));
          }
          var scheme = localStorage.getItem("monocode.colorScheme");
          if (scheme === "system") {
            scheme = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (scheme === "light") {
            root.classList.add("theme-light");
          }
          // Paint the first frame in the active workspace's own theme, so
          // startup never flashes a default or older palette first. A corrupt
          // store must not skip the platform classes below.
          try {
            var themes = JSON.parse(
              localStorage.getItem("monocode.personal.workspaceThemes.v1") ||
                "null",
            );
            var profiles = JSON.parse(
              localStorage.getItem("monocode.workspaceProfiles.v1") || "null",
            );
            var theme =
              themes &&
              ((profiles &&
                themes.themes &&
                themes.themes[profiles.activeProfileId]) ||
                themes.fallback);
            if (theme && typeof theme === "object") {
              var light =
                theme.preference === "light" ||
                (theme.preference === "system" &&
                  window.matchMedia("(prefers-color-scheme: light)").matches);
              root.classList.toggle("theme-light", !!light);
              var colors =
                theme.colors && theme.colors[light ? "light" : "dark"];
              var background = colors && colors.background;
              if (/^#[0-9a-fA-F]{6}$/.test(background || "")) {
                root.style.setProperty("--boot-background", background);
              }
            }
          } catch (_) {}
          var bodyGlass = localStorage.getItem("monocode.bodyGlass");
          if (bodyGlass === "1" || bodyGlass === "true") {
            root.classList.add("glass-body");
          }
          var isMac =
            typeof navigator !== "undefined" &&
            /Mac|iPhone|iPad/.test(navigator.platform);
          if (isMac) {
            root.classList.add("is-mac");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        --theme-hue: 207;
        --theme-saturation: 0%;
        --sidebar-opacity: 1;
        --boot-background: #000000;
        --background-lightness: 9%;
        --color-background-base: hsl(
          var(--theme-hue) var(--theme-saturation) var(--background-lightness)
        );
      }

      html.theme-light {
        --background-lightness: 97%;
        --boot-background: #ffffff;
      }

      html,
      body,
      #boot-splash {
        margin: 0;
        background: var(--boot-background);
      }

      /* Recovery is hidden during normal startup; the workspace appears directly. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background: var(--theme-background-color, var(--boot-background));
        color: #e7edf4;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      html.theme-light #boot-splash {
        color: #1d2835;
      }

      #boot-splash[hidden],
      #boot-splash [hidden] {
        display: none !important;
      }

      #boot-status {
        box-sizing: border-box;
        width: min(440px, 100%);
        padding: 0 24px;
        text-align: center;
      }

      #boot-status h1 {
        margin: 0;
        color: inherit;
        font: inherit;
        font-size: 18px;
        font-weight: 600;
      }

      #boot-status p {
        margin: 10px 0 18px;
        opacity: 0.75;
      }

      #boot-retry {
        padding: 8px 16px;
        border: 1px solid currentColor;
        border-radius: 8px;
        color: inherit;
        background: transparent;
        font: inherit;
        cursor: pointer;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" hidden>
      <section id="boot-status" role="status" aria-live="polite">
        <h1 id="boot-title"></h1>
        <p id="boot-message" hidden></p>
        <button id="boot-retry" type="button" hidden>Retry loading</button>
      </section>
    </div>
    <div id="root"></div>
    <!-- This must run without any fetched modules: it also handles a failed entry bundle. -->
    <script id="aven-boot-recovery">
      (function () {
        var splash = document.getElementById("boot-splash");
        var title = document.getElementById("boot-title");
        var message = document.getElementById("boot-message");
        var retry = document.getElementById("boot-retry");
        var active = true;

        function finished() {
          return !splash.isConnected || splash.dataset.dismissed === "1";
        }

        function cleanup() {
          if (!active) return;
          active = false;
          window.clearTimeout(timeout);
          window.removeEventListener("error", resourceError, true);
          retry.removeEventListener("click", reload);
          observer.disconnect();
        }

        function showRecovery(failed) {
          if (!active) return;
          if (finished()) return cleanup();
          window.clearTimeout(timeout);
          splash.hidden = false;
          title.textContent = failed
            ? "Aven couldn’t load its interface"
            : "Aven is taking longer to open";
          message.textContent = failed
            ? "A required app file didn’t load. Try loading the interface again."
            : "The workspace is still loading. You can keep waiting or try again.";
          message.hidden = false;
          retry.hidden = false;
          splash.style.pointerEvents = "auto";
        }

        function resourceError(event) {
          var target = event.target;
          if (
            target &&
            target.tagName === "SCRIPT" &&
            target.type === "module"
          ) {
            showRecovery(true);
          }
        }

        function reload() {
          window.location.reload();
        }

        var timeout = window.setTimeout(function () {
          showRecovery(false);
        }, 15000);
        var observer = new MutationObserver(function () {
          if (finished()) cleanup();
        });
        observer.observe(document.body, { childList: true });
        observer.observe(splash, {
          attributes: true,
          attributeFilter: ["data-dismissed"],
        });
        window.addEventListener("error", resourceError, true);
        retry.addEventListener("click", reload);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
