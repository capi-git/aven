<!doctype html>
<meta charset="utf-8">
<title>Portal menu</title>
<!-- A menu rendered in a portal above a full-page overlay, with the page
     made inert (pointer-events: none) while it is open, as modal menus do. -->
<style>
  body { font: 14px system-ui; margin: 40px; height: 1200px; }
  #overlay { position: fixed; inset: 0; z-index: 10; background: transparent; pointer-events: auto; }
  #menu { position: fixed; top: 120px; left: 200px; z-index: 11; border: 1px solid #888; background: #fff; padding: 4px; pointer-events: auto; }
  #menu button { display: block; width: 160px; text-align: left; }
  #behind { margin-top: 80px; }
</style>
<button id="open">Options</button>
<button id="behind">Behind the overlay</button>
<script>
  window.agentLog = [];
  const opener = document.querySelector("#open");
  document.querySelector("#behind").addEventListener("click", (event) => agentLog.push("behind:" + (event.isTrusted ? "trusted" : "direct")));
  let portal = null;
  const close = () => { portal?.remove(); portal = null; document.body.style.pointerEvents = ""; };
  opener.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    event.preventDefault();
    agentLog.push("open:pointerdown");
    if (portal) return close();
    portal = document.createElement("div");
    portal.innerHTML = '<div id="overlay"></div><div id="menu" role="menu"><button role="menuitem" id="rename">Rename</button><button role="menuitem" id="remove">Delete</button></div>';
    portal.querySelector("#overlay").addEventListener("pointerdown", () => { agentLog.push("overlay:dismiss"); close(); });
    for (const item of portal.querySelectorAll("[role=menuitem]"))
      item.addEventListener("click", (event) => { agentLog.push("item:" + item.id + ":" + (event.isTrusted ? "trusted" : "direct")); close(); });
    document.body.append(portal);
    document.body.style.pointerEvents = "none";
  });
</script>
