name: Feature request
description: Suggest an improvement to Aven
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and the problem you encounter.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Describe the change or interaction you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Optional. Add a sketch, screenshot, or another approach you considered.
