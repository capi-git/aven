name: Code checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:web
      - run: npm run check:tooling

  native:
    # The WebKit build checks shared native code without downloading Chromium.
    # The release workflow separately builds and tests the full Chromium app.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # One cache kept by main. Pull requests restore it but do not save
      # their own copies; whole-target copies per pull request and per version
      # bump filled the repository's cache storage and evicted the rest.
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --workspace --no-default-features

  native-windows:
    # Check filesystem/handle semantics before the release-only installer job.
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-native-checks
      - run: cargo fmt --all --check
      # Platform-only unused-code warnings remain visible; compiler errors fail.
      - run: cargo clippy --locked --workspace --all-targets --no-default-features
      - run: cargo test --locked --workspace --no-default-features
