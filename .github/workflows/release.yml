name: Release Aven

# One run builds the macOS app and Windows installer from the same commit.
# Publishing creates one versioned release with both platform downloads and
# one latest.json update feed. Both platforms receive updates signed with the
# Aven updater key; the Windows installer has no Authenticode signature.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed downloads and signed updates
        type: boolean
        default: false
      windows:
        description: Build and attach the Windows installer
        type: boolean
        default: true
      expected_version:
        description: Optional version confirmed by the release UI
        type: string
        default: ''
      expected_source_sha:
        description: Optional full source commit confirmed by the release UI
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: macos-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # These jobs never talk to GitHub through git, so the checkout token is
      # not left in .git/config for later steps (MonoCode f8769ee1).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate requested release source
        env:
          AVEN_EXPECTED_VERSION: ${{ inputs.expected_version }}
          AVEN_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          actual_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          actual_version = json.loads(Path('package.json').read_text())['version']
          expected_version = os.environ.get('AVEN_EXPECTED_VERSION', '')
          expected_sha = os.environ.get('AVEN_EXPECTED_SOURCE_SHA', '')
          if actual_sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Checked-out source differs from the workflow revision; refusing to release.')
          if expected_version and actual_version != expected_version:
              raise SystemExit('Release version changed since confirmation; refresh the release status and try again.')
          if expected_sha and (not re.fullmatch(r'[0-9a-fA-F]{40}', expected_sha) or actual_sha != expected_sha.lower()):
              raise SystemExit('Release source changed since confirmation; refresh the release status and try again.')
          print('Release source verified: ' + actual_sha + ', version ' + actual_version)
          PY

  macos-arm64:
    needs: validate-source
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CEF_BUILD_DIR: ${{ github.workspace }}/target/chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Import Developer ID into an isolated signing keychain
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: python3 -B scripts/ci-signing-keychain.py
      - name: Install native build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
      - name: Download and verify pinned Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          task_cef_name='cef_binary_152.0.6+g708dc14+chromium-152.0.7977.83_macosarm64_minimal'
          task_cef_archive="$RUNNER_TEMP/$task_cef_name.tar.bz2"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://cef-builds.spotifycdn.com/$task_cef_name.tar.bz2" \
            --output "$task_cef_archive"
          printf '%s  %s\n' \
            b0f277f1025dcedd690f59dfe3d1ec5e2f7f90564d0e5de997e6fc3c1febfa48 \
            "$task_cef_archive" | shasum -a 256 -c -
          tar -xjf "$task_cef_archive" -C "$RUNNER_TEMP"
          printf 'CEF_ROOT=%s\n' "$RUNNER_TEMP/$task_cef_name" >> "$GITHUB_ENV"
      # Notarizes and staples before the ZIP is made when all three App Store
      # Connect secrets exist. Without them the candidate stays signed only and
      # signing-verification.json says so. build-release.sh hides these values
      # from dependency installs and compilation.
      - name: Test, build, notarize, and package candidate
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./scripts/build-release.sh
      - name: Sign final Chromium update archive
        if: inputs.publish
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          task_version="$(node -p "require('./package.json').version")"
          python3 -B scripts/release-signing.py verify --app target/release/bundle/macos/Aven.app
          # A notarized build's update archive must contain the stapled ticket.
          task_notarized="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("notarization", {}).get("notarized") is True)' "target/releases/v$task_version/signing-verification.json")"
          if [[ "$task_notarized" == True ]]; then
            xcrun stapler validate target/release/bundle/macos/Aven.app
          fi
          python3 scripts/package-update.py --app target/release/bundle/macos/Aven.app --out "target/releases/v$task_version"
          cd "target/releases/v$task_version"
          shasum -a 256 "Aven-$task_version-macos-arm64.app.tar.gz" "Aven-$task_version-macos-arm64.app.tar.gz.sig" latest.json >> SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Upload candidate for manual review
        uses: actions/upload-artifact@v4
        with:
          name: Aven-macos-arm64-candidate
          path: target/releases/v*/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          set -uo pipefail
          task_status=0
          python3 -B scripts/notarize-release.py cleanup || task_status=$?
          python3 -B scripts/ci-signing-keychain.py --cleanup || task_status=$?
          exit "$task_status"

  windows:
    needs: validate-source
    if: inputs.windows
    uses: ./.github/workflows/windows-candidate.yml
    with:
      sign_updates: ${{ inputs.publish }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    # Windows is optional, but when requested it must succeed before anything
    # is published, so a version never ships with half its downloads.
    if: >-
      ${{ !cancelled() && inputs.publish &&
      needs.validate-source.result == 'success' &&
      needs.macos-arm64.result == 'success' &&
      (needs.windows.result == 'success' || (!inputs.windows && needs.windows.result == 'skipped')) }}
    needs: [validate-source, macos-arm64, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Aven-macos-arm64-candidate
          path: release
      - uses: actions/download-artifact@v4
        if: inputs.windows
        with:
          name: Aven-windows-x64
          path: windows
      - name: Publish Aven release
        env:
          GH_TOKEN: ${{ github.token }}
          AVEN_INCLUDE_WINDOWS: ${{ inputs.windows }}
        run: |
          set -euo pipefail
          case "$AVEN_INCLUDE_WINDOWS" in
            true|false) ;;
            *) echo 'Windows release selection must be true or false.' >&2; exit 1 ;;
          esac
          task_version="$(node -p "require('./package.json').version")"
          task_release_dir="release/v$task_version"
          test -s "$task_release_dir/latest.json"
          (cd "$task_release_dir" && sha256sum -c SHA256SUMS)
          python3 - "$task_release_dir/signing-verification.json" "$task_release_dir/latest.json" "$task_version" <<'PY'
          import json, sys
          from pathlib import Path
          expected = json.loads(Path('scripts/release-signing.json').read_text())
          result = json.loads(Path(sys.argv[1]).read_text())
          required = {
              'status': 'verified',
              'mode': 'developer-id',
              'teamId': expected['teamId'],
              'bundleId': expected['bundleId'],
              'strictSignatureVerification': 'passed',
          }
          if any(result.get(key) != value for key, value in required.items()):
              raise SystemExit('Refusing to publish an unverified signing identity.')
          update = json.loads(Path(sys.argv[2]).read_text())
          platforms = update.get('platforms')
          # The macOS build writes the feed; Windows is added below, only from
          # this run's verified package.
          if update.get('version') != sys.argv[3] or not isinstance(platforms, dict) or set(platforms) != {'darwin-aarch64'}:
              raise SystemExit('Refusing to publish an unexpected updater version or platform; the macOS feed must describe only macOS.')
          PY
          # Never attach a new binary to a tag that points at different source.
          task_tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$task_version" > /dev/null 2>&1 || task_tag_status=$?
          case "$task_tag_status" in
            2) ;; # Only a successful lookup with no matching ref permits publication.
            0)
              echo "Version tag already exists; choose a new release version." >&2
              exit 1
              ;;
            *)
              echo "Could not verify whether the release tag exists (Git exit $task_tag_status); refusing to publish." >&2
              exit 1
              ;;
          esac
          # Describe notarization only as the macOS job recorded it.
          task_macos_notes="$(python3 - "$task_release_dir/signing-verification.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          notarization = json.loads(Path(sys.argv[1]).read_text()).get('notarization')
          notarization = notarization if isinstance(notarization, dict) else {}
          if notarization.get('notarized') is True:
              if not (notarization.get('stapled') is True and notarization.get('gatekeeper') == 'accepted'
                      and re.fullmatch(r'[0-9a-fA-F-]{36}', str(notarization.get('submissionId', '')))):
                  raise SystemExit('Refusing to publish an incomplete notarization record.')
              print('macOS Apple Silicon: the app is Developer ID signed and notarized by Apple, so it opens normally after download. macOS updates are signed by Aven.')
          else:
              print('::warning title=Not notarized::Publishing a macOS build that is Developer ID signed but not Apple-notarized.', file=sys.stderr)
              print('macOS Apple Silicon: the app is Developer ID signed, and macOS updates are signed by Aven. This Mac build is not Apple-notarized, so macOS may ask you to approve opening it in System Settings > Privacy & Security.')
          PY
          )"
          task_notes="Aven $task_version. $task_macos_notes See CHANGELOG.md for changes."
          task_windows_dir="windows/Aven-$task_version-windows-x64"
          if [[ "$AVEN_INCLUDE_WINDOWS" == true ]]; then
            # The package keeps its own checksums; the release list covers the
            # ZIP and installer so every attached file is verifiable.
            task_windows_installer="$(python3 - "$task_windows_dir" "$GITHUB_SHA" <<'PY'
          import re, sys
          from pathlib import Path
          folder = Path(sys.argv[1])
          def require(condition, message):
              if not condition:
                  raise SystemExit('Invalid requested Windows package: ' + message)
          require(folder.is_dir() and not folder.is_symlink(), 'expected artifact directory is missing')
          files = list(folder.iterdir())
          require(all(path.is_file() and not path.is_symlink() for path in files), 'expected regular package files only')
          for name in ('SHA256SUMS', 'README.md'):
              require((folder / name).is_file() and (folder / name).stat().st_size > 0, name + ' is missing or empty')
          installers = [path for path in files if path.name.endswith('-setup.exe')]
          require(len(installers) == 1, 'expected exactly one installer')
          signatures = [path.name for path in files if path.name.endswith('.sig')]
          require(signatures == [installers[0].name + '.sig'], 'expected one updater signature for the installer')
          markers = [line for line in (folder / 'README.md').read_text().splitlines() if line.startswith('Source commit:')]
          require(markers == ['Source commit: ' + sys.argv[2]], 'source commit does not match this release')
          names = []
          for line in (folder / 'SHA256SUMS').read_text().splitlines():
              match = re.fullmatch(r'[0-9a-fA-F]{64}  ([^/\\\r\n]+)', line)
              require(match is not None, 'invalid checksum entry')
              names.append(match.group(1))
          require(len(names) == len(set(names)), 'duplicate checksum entry')
          require(set(names) == {path.name for path in files if path.name != 'SHA256SUMS'}, 'checksums must cover every package file')
          print(installers[0].name)
          PY
            )"
            # PowerShell writes CRLF; normalize the verification stream only.
            (cd "$task_windows_dir" && tr -d '\r' < SHA256SUMS | sha256sum -c -)
            (cd windows && zip -qr "../$task_release_dir/Aven-$task_version-windows-x64.zip" "Aven-$task_version-windows-x64")
            cp "$task_windows_dir/$task_windows_installer" "$task_windows_dir/$task_windows_installer.sig" "$task_release_dir/"
            (cd "$task_release_dir" && sha256sum "Aven-$task_version-windows-x64.zip" "$task_windows_installer" "$task_windows_installer.sig" >> SHA256SUMS)
            python3 -B scripts/release-assets.py add-windows-update --release-dir "$task_release_dir" \
              --version "$task_version" --installer "$task_windows_installer" \
              --url-base "https://github.com/$GITHUB_REPOSITORY/releases/download/v$task_version"
            python3 -B scripts/release-assets.py add-stable-aliases --release-dir "$task_release_dir" \
              --version "$task_version" --windows-installer "$task_windows_installer"
            task_notes="$task_notes

          Windows x64: the ZIP and setup installer are regular release downloads built from the same commit. The Windows installer has no Authenticode signature, so Windows may warn about an unknown publisher when you first install it. Installed Windows versions from this release on download updates signed by Aven and install them when you choose to restart. See docs/WINDOWS.md for setup and platform limitations."
          else
            python3 -B scripts/release-assets.py add-stable-aliases --release-dir "$task_release_dir" --version "$task_version"
          fi
          (cd "$task_release_dir" && sha256sum -c SHA256SUMS)
          gh release create "v$task_version" "$task_release_dir"/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Aven $task_version" --latest \
            --notes "$task_notes"
