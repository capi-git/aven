name: Release Aven

# One run builds the macOS app and the Windows test installer from the same
# commit. Publishing creates a single versioned release: the Developer ID
# signed macOS update is the stable download, and the Windows installer is
# attached as a clearly named test package.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this reviewed version to Aven's update channel
        type: boolean
        default: false
      windows:
        description: Build and attach the Windows test installer
        type: boolean
        default: true
      expected_version:
        description: Optional version confirmed by the release UI
        type: string
        default: ''
      expected_source_sha:
        description: Optional full source commit confirmed by the release UI
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: macos-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested release source
        env:
          AVEN_EXPECTED_VERSION: ${{ inputs.expected_version }}
          AVEN_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          actual_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          actual_version = json.loads(Path('package.json').read_text())['version']
          expected_version = os.environ.get('AVEN_EXPECTED_VERSION', '')
          expected_sha = os.environ.get('AVEN_EXPECTED_SOURCE_SHA', '')
          if actual_sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Checked-out source differs from the workflow revision; refusing to release.')
          if expected_version and actual_version != expected_version:
              raise SystemExit('Release version changed since confirmation; refresh the release status and try again.')
          if expected_sha and (not re.fullmatch(r'[0-9a-fA-F]{40}', expected_sha) or actual_sha != expected_sha.lower()):
              raise SystemExit('Release source changed since confirmation; refresh the release status and try again.')
          print('Release source verified: ' + actual_sha + ', version ' + actual_version)
          PY

  macos-arm64:
    needs: validate-source
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CEF_BUILD_DIR: ${{ github.workspace }}/target/chromium
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Import Developer ID into an isolated signing keychain
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: python3 -B scripts/ci-signing-keychain.py
      - name: Install native build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
      - name: Download and verify pinned Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          task_cef_name='cef_binary_152.0.6+g708dc14+chromium-152.0.7977.83_macosarm64_minimal'
          task_cef_archive="$RUNNER_TEMP/$task_cef_name.tar.bz2"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://cef-builds.spotifycdn.com/$task_cef_name.tar.bz2" \
            --output "$task_cef_archive"
          printf '%s  %s\n' \
            b0f277f1025dcedd690f59dfe3d1ec5e2f7f90564d0e5de997e6fc3c1febfa48 \
            "$task_cef_archive" | shasum -a 256 -c -
          tar -xjf "$task_cef_archive" -C "$RUNNER_TEMP"
          printf 'CEF_ROOT=%s\n' "$RUNNER_TEMP/$task_cef_name" >> "$GITHUB_ENV"
      - name: Test, build, and package candidate
        run: ./scripts/build-release.sh
      - name: Sign final Chromium update archive
        if: inputs.publish
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          task_version="$(node -p "require('./package.json').version")"
          python3 -B scripts/release-signing.py verify --app target/release/bundle/macos/Aven.app
          python3 scripts/package-update.py --app target/release/bundle/macos/Aven.app --out "target/releases/v$task_version"
          cd "target/releases/v$task_version"
          shasum -a 256 "Aven-$task_version-macos-arm64.app.tar.gz" "Aven-$task_version-macos-arm64.app.tar.gz.sig" latest.json >> SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Upload candidate for manual review
        uses: actions/upload-artifact@v4
        with:
          name: Aven-macos-arm64-candidate
          path: target/releases/v*/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: python3 -B scripts/ci-signing-keychain.py --cleanup

  windows:
    needs: validate-source
    if: inputs.windows
    uses: ./.github/workflows/windows-candidate.yml

  publish:
    # Windows is optional, but when requested it must succeed before anything
    # is published, so a version never ships with half its downloads.
    if: >-
      ${{ !cancelled() && inputs.publish &&
      needs.validate-source.result == 'success' &&
      needs.macos-arm64.result == 'success' &&
      (needs.windows.result == 'success' || (!inputs.windows && needs.windows.result == 'skipped')) }}
    needs: [validate-source, macos-arm64, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Aven-macos-arm64-candidate
          path: release
      - uses: actions/download-artifact@v4
        if: inputs.windows
        with:
          name: Aven-windows-x64-test
          path: windows
      - name: Publish signed Aven release
        env:
          GH_TOKEN: ${{ github.token }}
          AVEN_INCLUDE_WINDOWS: ${{ inputs.windows }}
        run: |
          set -euo pipefail
          case "$AVEN_INCLUDE_WINDOWS" in
            true|false) ;;
            *) echo 'Windows release selection must be true or false.' >&2; exit 1 ;;
          esac
          task_version="$(node -p "require('./package.json').version")"
          task_release_dir="release/v$task_version"
          test -s "$task_release_dir/latest.json"
          (cd "$task_release_dir" && sha256sum -c SHA256SUMS)
          python3 - "$task_release_dir/signing-verification.json" <<'PY'
          import json, sys
          from pathlib import Path
          expected = json.loads(Path('scripts/release-signing.json').read_text())
          result = json.loads(Path(sys.argv[1]).read_text())
          required = {
              'status': 'verified',
              'mode': 'developer-id',
              'teamId': expected['teamId'],
              'bundleId': expected['bundleId'],
              'strictSignatureVerification': 'passed',
          }
          if any(result.get(key) != value for key, value in required.items()):
              raise SystemExit('Refusing to publish an unverified signing identity.')
          PY
          # Never attach a new binary to a tag that points at different source.
          task_tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$task_version" > /dev/null 2>&1 || task_tag_status=$?
          case "$task_tag_status" in
            2) ;; # Only a successful lookup with no matching ref permits publication.
            0)
              echo "Version tag already exists; choose a new release version." >&2
              exit 1
              ;;
            *)
              echo "Could not verify whether the release tag exists (Git exit $task_tag_status); refusing to publish." >&2
              exit 1
              ;;
          esac
          task_notes="Aven $task_version for Apple Silicon Macs. The app is Developer ID signed and updates are signed by Aven. This build is not Apple-notarized. See CHANGELOG.md for changes."
          task_windows_dir="windows/Aven-$task_version-windows-x64-test"
          if [[ "$AVEN_INCLUDE_WINDOWS" == true ]]; then
            # The package keeps its own checksums; the release list covers the
            # ZIP and installer so every attached file is verifiable.
            task_windows_installer="$(python3 - "$task_windows_dir" "$GITHUB_SHA" <<'PY'
          import re, sys
          from pathlib import Path
          folder = Path(sys.argv[1])
          def require(condition, message):
              if not condition:
                  raise SystemExit('Invalid requested Windows package: ' + message)
          require(folder.is_dir() and not folder.is_symlink(), 'expected artifact directory is missing')
          files = list(folder.iterdir())
          require(all(path.is_file() and not path.is_symlink() for path in files), 'expected regular package files only')
          for name in ('SHA256SUMS', 'README.md'):
              require((folder / name).is_file() and (folder / name).stat().st_size > 0, name + ' is missing or empty')
          installers = [path for path in files if path.name.endswith('-setup.exe')]
          require(len(installers) == 1, 'expected exactly one installer')
          markers = [line for line in (folder / 'README.md').read_text().splitlines() if line.startswith('Source commit:')]
          require(markers == ['Source commit: ' + sys.argv[2]], 'source commit does not match this release')
          names = []
          for line in (folder / 'SHA256SUMS').read_text().splitlines():
              match = re.fullmatch(r'[0-9a-fA-F]{64}  ([^/\\\r\n]+)', line)
              require(match is not None, 'invalid checksum entry')
              names.append(match.group(1))
          require(len(names) == len(set(names)), 'duplicate checksum entry')
          require(set(names) == {path.name for path in files if path.name != 'SHA256SUMS'}, 'checksums must cover every package file')
          print(installers[0].name)
          PY
            )"
            # PowerShell writes CRLF; normalize the verification stream only.
            (cd "$task_windows_dir" && tr -d '\r' < SHA256SUMS | sha256sum -c -)
            (cd windows && zip -qr "../$task_release_dir/Aven-$task_version-windows-x64-test.zip" "Aven-$task_version-windows-x64-test")
            cp "$task_windows_dir/$task_windows_installer" "$task_release_dir/"
            (cd "$task_release_dir" && sha256sum "Aven-$task_version-windows-x64-test.zip" "$task_windows_installer" >> SHA256SUMS && sha256sum -c SHA256SUMS)
            task_notes="$task_notes

          Windows x64 test build: the ZIP and setup file are unsigned test downloads built from the same commit. Windows may warn about an unknown publisher, and Windows builds do not update automatically. See docs/WINDOWS-TESTING.md."
          fi
          gh release create "v$task_version" "$task_release_dir"/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Aven $task_version" --latest \
            --notes "$task_notes"
