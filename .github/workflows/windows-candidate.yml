name: Build Windows installer

# Run on its own for an unpublished candidate, or from "Release Aven", which
# attaches the same installer to the regular macOS and Windows release.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A release call must not cancel, or be cancelled by, a standalone candidate run.
  group: windows-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'Build Windows installer' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:web

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-candidate-compiled-v2
          cache-on-failure: true
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - run: npm run build
      - name: Run native Windows tests
        run: cargo test --locked --workspace --release --target x86_64-pc-windows-msvc --no-default-features --features tauri/custom-protocol
      - name: Generate Windows dependency notices
        run: python scripts/generate-third-party-notices.py --target x86_64-pc-windows-msvc --npm-os win32 --npm-cpu x64
      - name: Build NSIS installer
        run: npm run build:windows
      - name: Preserve built installer
        uses: actions/upload-artifact@v4
        with:
          name: Aven-windows-x64-installer
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.txt
            docs/WINDOWS.md
          if-no-files-found: error
          retention-days: 30
      - name: Install and launch on Windows
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if (@($installer).Count -ne 1) { throw 'Expected exactly one Windows installer' }
          ./scripts/test-windows-install.ps1 -Installer $installer.FullName -OutputDir target/windows-smoke
      - name: Prepare Windows release package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $output = "target/releases/Aven-$version-windows-x64"
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe $output
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.txt $output
          Copy-Item docs/WINDOWS.md "$output/README.md"
          "Source commit: $env:GITHUB_SHA" | Add-Content "$output/README.md"
          Get-ChildItem -LiteralPath $output -File | Where-Object Name -ne SHA256SUMS | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "$output/SHA256SUMS" -Encoding utf8
          Get-Content "$output/SHA256SUMS" | ForEach-Object {
            $entry = [regex]::Match($_, '^([0-9a-f]{64})  (.+)$')
            if (-not $entry.Success) { throw 'Invalid checksum entry' }
            $actual = (Get-FileHash (Join-Path $output $entry.Groups[2].Value) -Algorithm SHA256).Hash
            if ($actual -ine $entry.Groups[1].Value) { throw "Checksum mismatch: $_" }
          }
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Aven-windows-x64
          path: target/releases/Aven-*-windows-x64/
          if-no-files-found: error
          retention-days: 30
      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aven-windows-startup-evidence
          path: target/windows-smoke/
          if-no-files-found: ignore
          retention-days: 30
